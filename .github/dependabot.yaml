version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /litellm-rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: docker
    directories:
    - /
    - /backend
    - /cookbook/litellm-ollama-docker-image
    - /deploy/lens
    - /docker
    - /docker/build_from_pip
    - /gateway
    - /litellm-rust/crates/gateway
    - /migrations
    - /ops/otel-guard
    - /tests/e2e/claude_code/cron_vm
    - /tests/unit
    - /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: docker-compose
    directories:
    - /
    - /deploy/lens
    - /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: github-actions
    directories:
    - /.github/actions/cache-cargo-build
    - /.github/actions/cache-prisma-binaries
    - /.github/actions/cache-uv-downloads
    - /.github/actions/detect-changes
    - /.github/actions/rust-bridge
    - /.github/actions/setup-uv-with-retries
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: gomod
    directories:
    - /cookbook/gollem_go_agent_framework
    - /terraform/provider
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
