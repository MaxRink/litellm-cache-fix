        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: npm
    directories:
    - /
    - /tests/e2e/ui
    - /tests/pass_through_tests
    - /tests/proxy_admin_ui_tests/ui_unit_tests
    - /ui/litellm-dashboard
    - /vscode-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: pip
    directories:
    - /cookbook/anthropic_agent_sdk
    - /cookbook/litellm-ollama-docker-image
