name: Publish diagnostic overlay

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/litellm-cache-key-diagnostic
          file: docker/litellm-cache-key-diagnostic/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/maxrink/litellm-cache-key-diagnostic:6d32ffd6e92b81ce862a4d45a30f765fe44c958a
