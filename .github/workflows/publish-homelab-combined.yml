name: Publish homelab combined LiteLLM image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    name: publish combined homelab LiteLLM image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: Dockerfile.homelab-combined
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/litellm-otel-cache-fix:f5a0a0d-guard1433
