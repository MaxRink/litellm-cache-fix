name: Publish homelab combined LiteLLM image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homelab-image-publish
  cancel-in-progress: false
jobs:
  publish:
    name: Publish homelab image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to publish the image to GHCR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.homelab-combined
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/litellm-otel-cache-fix:f5a0a0d-guard1433