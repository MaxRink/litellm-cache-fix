name: Publish homelab combined LiteLLM image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homelab-image-publish
  cancel-in-progress: false
jobs:
  publish:
    name: Publish homelab image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to publish the image to GHCR.
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.homelab-combined
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/litellm-otel-cache-fix:f5a0a0d-guard1433