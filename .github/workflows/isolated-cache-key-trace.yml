name: isolated-cache-key-trace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned production image
        run: docker pull ghcr.io/maxrink/litellm-otel-cache-fix@sha256:d544bc8c2000be45030b07c23959de3877420e2df4cffe57d8d87d9e33c70ee2
      - name: Run real ASGI auth RouteAudit Ollama cache trace
        run: |
          docker run --rm --network host \
            --entrypoint /app/.venv/bin/python \
            -v "$GITHUB_WORKSPACE/validation/ollama-asgi-keytrace-fixture.py:/run/fixture.py:ro" \
            -v "$GITHUB_WORKSPACE/validation/routing_audit.py:/run/routing_audit.py:ro" \
            ghcr.io/maxrink/litellm-otel-cache-fix@sha256:d544bc8c2000be45030b07c23959de3877420e2df4cffe57d8d87d9e33c70ee2 \
            -c "exec(compile(open('/run/fixture.py').read(), '/run/fixture.py', 'exec'))"
