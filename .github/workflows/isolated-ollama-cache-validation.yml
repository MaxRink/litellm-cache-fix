name: isolated-ollama-cache-validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ollama-local-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull pinned production image
        run: docker pull ghcr.io/maxrink/litellm-otel-cache-fix@sha256:d544bc8c2000be45030b07c23959de3877420e2df4cffe57d8d87d9e33c70ee2
      - name: Run real Ollama adapter with mocked transport
        run: |
          docker run --rm --network none \
            --entrypoint /app/.venv/bin/python \
            -v "$GITHUB_WORKSPACE/validation/ollama-cache-fixture.py:/tmp/ollama-cache-fixture.py:ro" \
            ghcr.io/maxrink/litellm-otel-cache-fix@sha256:d544bc8c2000be45030b07c23959de3877420e2df4cffe57d8d87d9e33c70ee2 \
            -c "exec(compile(open('/tmp/ollama-cache-fixture.py').read(), '/tmp/ollama-cache-fixture.py', 'exec'))"
