name: Publish homelab minimal OTEL image
on:
  workflow_dispatch:
concurrency:
  group: homelab-publish-${{ github.workflow }}
  cancel-in-progress: false
permissions: {}
jobs:
  publish:
    name: Publish homelab minimal OTEL image
    permissions:
      contents: read
      packages: write # required to publish the GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.homelab-minimal
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/litellm-otel-fix-minimal:1.104.2
